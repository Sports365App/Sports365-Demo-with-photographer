<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sports365 Coach Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
  [hidden] { display: none !important; }
  body { background: #2a2c31; }
  .app { display: grid; grid-template-columns: 236px 1fr; min-height: 100vh; }
  .side { background: #1c1e22; padding: 14px 12px calc(14px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .side .brand { display: flex; align-items: center; gap: 8px; text-decoration: none; font: 800 20px/1 var(--font-display); text-transform: uppercase; margin: 0 0 14px 4px; }
  .side .brand img { width: 40px; height: 40px; }
  .side .brand b { color: var(--accent); }
  .side nav { display: grid; gap: 2px; }
  .side nav .grp { font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #6b6f78; margin: 10px 0 2px 10px; }
  .side nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; text-decoration: none; font-size: 14px; color: #d4d6db; }
  .side nav a:hover { background: #26292f; }
  .side nav a.on { background: var(--accent-deep); color: #fff; font-weight: 600; }
  .side nav svg { width: 16px; height: 16px; flex: none; }
  .side .count { margin-left: auto; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 700; border-radius: 999px; padding: 1px 7px; }
  .side .lock { margin-left: auto; font-size: 10px; font-weight: 700; color: var(--muted); border: 1px solid #3a3d45; border-radius: 4px; padding: 1px 5px; }
  .side nav a.on .lock { color: #fff; border-color: rgba(255,255,255,.4); }
  .plan { margin-top: 14px; background: #2a2d33; border-radius: 10px; padding: 12px; font-size: 12px; display: grid; gap: 6px; }
  .plan b { display: block; font-size: 13px; }
  .plan a { color: var(--accent); font-weight: 600; }
  .logout { margin-top: 10px; background: #3a3d45; color: var(--fg); }

  .demo-bar { display: flex; flex-wrap: wrap; gap: 8px 14px; justify-content: center; align-items: center; }
  .viewas { display: inline-flex; align-items: center; gap: 6px; }
  .viewas button { font: 600 12px var(--font-body); color: var(--fg); background: #1b1d22; border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; min-height: 28px; cursor: pointer; }
  .viewas button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  .main { padding: 18px max(18px, env(safe-area-inset-right, 0px)) 40px 18px; min-width: 0; }
  .view { display: grid; gap: 14px; align-content: start; min-width: 0; }
  .vhead { background: var(--accent-deep); border-radius: 12px; padding: 14px 18px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
  .vhead h1 { font: 700 22px/1.2 var(--font-body); text-transform: none; letter-spacing: 0; display: flex; align-items: center; gap: 10px; }
  .vhead p { font-size: 13px; color: #fde3d2; margin-top: 2px; }
  .vhead .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  .welcome { background: var(--accent-deep); border-radius: 12px; padding: 18px 20px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 14px; }
  .welcome small { font-size: 12px; }
  .welcome h1 { font: 700 26px/1.2 var(--font-body); text-transform: none; letter-spacing: 0; }
  .welcome .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-white { background: #fff; color: #1b1d22; }
  .btn-maroon { background: #7c2d12; color: #fff; }
  .btn-red { background: #b91c1c; color: #fff; }
  .btn-yellow { background: #ca8a04; color: #1b1d22; }
  .btn-up { background: transparent; color: var(--accent); border: 1px solid var(--accent); justify-self: start; }
  .plan-chip { display: inline-block; margin-left: 8px; font: 700 11px var(--font-body); background: #1b1d22; color: #fff; padding: 3px 8px; border-radius: 999px; vertical-align: middle; }

  .panel { background: #34363c; border: 1px solid #40434a; border-radius: 12px; padding: 16px; min-width: 0; }
  .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .panel-head h2 { font: 700 16px var(--font-body); text-transform: none; letter-spacing: 0; display: flex; align-items: center; gap: 8px; }
  .panel-head a, .linkbtn { color: var(--accent); font-size: 12px; background: none; border: 0; cursor: pointer; font-family: inherit; padding: 0; }
  .tier { font: 700 10px var(--font-body); letter-spacing: .06em; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; }
  .tier.pro { background: #3a1d0d; color: #fdba74; }
  .tier.elite { background: #1e1b4b; color: #c4b5fd; }
  .vhead .tier.pro { background: #fff; color: #9a3412; }
  .vhead .tier.elite { background: #fff; color: #4c1d95; }
  .sub { font-size: 12px; color: var(--muted); }

  /* Tables */
  .tbl { overflow-x: auto; }
  .tbl table { width: 100%; min-width: 620px; border-collapse: collapse; font-size: 13px; }
  .tbl th, .tbl td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #45484f; vertical-align: middle; }
  .tbl th { font-size: 12px; color: #c9ccd2; font-weight: 600; }
  .tbl tr:last-child td { border-bottom: 0; }
  .tbl td .acts { display: flex; gap: 6px; }
  .tbl .num { font-variant-numeric: tabular-nums; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; align-items: center; margin-bottom: 12px; }
  .toolbar input, .toolbar select { width: auto; min-width: 200px; }
  .toolbar .grow { margin-right: auto; }
  .pager { display: flex; justify-content: flex-end; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 10px; }

  /* Tabs */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid #45484f; margin-bottom: 14px; overflow-x: auto; }
  .tabs button { background: none; border: 0; border-bottom: 2px solid transparent; color: #d4d6db; font: 600 14px var(--font-body); padding: 10px 12px; cursor: pointer; white-space: nowrap; }
  .tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }

  /* Forms */
  .form { display: grid; gap: 12px; }
  .form .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .form .row4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .form .row2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .form h3 { font: 700 15px var(--font-body); text-transform: none; letter-spacing: 0; margin-top: 4px; }
  .form .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .profile-grid { display: grid; grid-template-columns: 1fr 180px; gap: 20px; align-items: start; }
  .avatar { width: 150px; height: 150px; border-radius: 50%; background: #7c2d12; border: 4px solid #4a4d55; display: grid; place-items: center; font: 800 46px var(--font-display); color: #fde3d2; margin: 0 auto; }
  .avatar-col { display: grid; gap: 8px; justify-items: center; text-align: center; font-size: 13px; font-weight: 600; }
  .swatches { display: flex; gap: 8px; }
  .swatches i { width: 34px; height: 34px; border-radius: 8px; display: block; border: 2px solid #4a4d55; }
  .swatches i.on { border-color: #fff; }

  /* Home bits */
  .setup-top { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-size: 13px; }
  .setup-top b { font-size: 15px; }
  .bar { height: 6px; background: #4a4d55; border-radius: 9px; margin: 10px 0 12px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 9px; }
  .tasks { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .task { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border: 1px solid #4a4d55; border-radius: 8px; background: #2c2e33; font-size: 13px; color: var(--fg); }
  .task .dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #8b8f99; flex: none; display: grid; place-items: center; font-size: 10px; }
  .task.done { color: #8b8f99; text-decoration: line-through; }
  .task.done .dot { background: var(--good); border-color: var(--good); color: #fff; }
  .task.next { border-color: var(--accent); }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .kpi small { font-size: 13px; color: #c9ccd2; }
  .kpi b { display: block; font: 800 40px/1.1 var(--font-display); margin: 4px 0 2px; font-variant-numeric: tabular-nums; }
  .kpi .note { font-size: 12px; color: var(--muted); }
  .kpi .up { color: #86efac; }
  .kpi.warn b { color: #fdba74; }
  .grid2 { display: grid; grid-template-columns: 1.45fr 1fr; gap: 14px; align-items: start; }
  .col { display: grid; gap: 14px; min-width: 0; }
  .sess { display: grid; grid-template-columns: 70px 4px 1fr auto; gap: 12px; align-items: center; background: #2c2e33; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .sess .time b { display: block; font-size: 14px; }
  .sess .time span, .sess .what span { font-size: 11px; color: var(--muted); }
  .sess .rail { height: 32px; border-radius: 4px; }
  .sess .what { min-width: 0; } .sess .what b { display: block; font-size: 14px; }
  .use { display: grid; gap: 12px; }
  .use-row .top { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
  .use-row .top span { color: var(--muted); font-variant-numeric: tabular-nums; }
  .use-row .bar { margin: 6px 0 0; }
  .use-row.full .bar i { background: #f59e0b; }
  .upsell { margin-top: 14px; background: #2c2e33; border: 1px dashed #5a5d66; border-radius: 8px; padding: 10px 12px; font-size: 12px; color: #c9ccd2; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .upsell a, .upsell button { color: var(--accent); font-weight: 600; white-space: nowrap; }
  .copy { display: flex; align-items: center; gap: 8px; background: #1f2125; border-radius: 8px; padding: 8px 8px 8px 12px; margin: 12px 0 10px; }
  .copy code { font: 13px var(--font-body); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .limit-msg { margin-top: 10px; background: #451a03; color: #fed7aa; border-radius: 8px; padding: 10px 12px; font-size: 12px; }
  .limit-msg button { color: #fff; font-weight: 700; background: none; border: 0; text-decoration: underline; cursor: pointer; font: inherit; padding: 0; }

  /* Calendar */
  .seg { display: inline-flex; gap: 6px; flex-wrap: wrap; }
  .seg button { font: 600 13px var(--font-body); background: #e5e7eb; color: #1b1d22; border: 0; border-radius: 6px; padding: 7px 12px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .month { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 1px solid #55585f; border-radius: 8px; overflow: hidden; margin-top: 12px; }
  .month .dh { background: #2c2e33; text-align: center; font-size: 12px; font-weight: 700; padding: 6px 0; border-bottom: 1px solid #55585f; }
  .month .d { min-height: 92px; border-right: 1px solid #45484f; border-bottom: 1px solid #45484f; padding: 4px 5px; display: grid; align-content: start; gap: 3px; min-width: 0; }
  .month .d:nth-child(7n) { border-right: 0; }
  .month .d .n { font-size: 12px; text-align: right; color: #d4d6db; }
  .month .d.out .n { color: #6b6f78; }
  .month .d.today { background: #3a1d0d; }
  .month .d.today .n { color: var(--accent); font-weight: 800; }
  .ev { display: block; border-radius: 3px; padding: 2px 5px; color: #fff; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev.o { background: var(--accent-deep); } .ev.b { background: var(--blue); } .ev.g { background: var(--good); } .ev.v { background: var(--violet); }
  .agenda .ag { display: grid; grid-template-columns: 110px 90px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; background: #2c2e33; border-radius: 8px; margin-bottom: 8px; font-size: 13px; }
  .agenda .ag b.d { color: var(--accent); }
  .week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
  .week .wc { background: #2c2e33; border-radius: 8px; padding: 8px; min-height: 220px; display: grid; align-content: start; gap: 6px; min-width: 0; }
  .week .wc h4 { margin: 0; font-size: 12px; text-align: center; }
  .week .wc.today { outline: 2px solid var(--accent); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 10px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

  /* Availability */
  .slots { display: grid; grid-template-columns: 70px repeat(7, minmax(0, 1fr)); gap: 3px; font-size: 12px; text-align: center; }
  .slots .h { font-weight: 700; padding: 6px 0; background: #2c2e33; border-radius: 4px; }
  .slots .h.today { background: var(--accent-deep); }
  .slots .t { color: var(--muted); text-align: right; padding: 8px 6px 0 0; }
  .slots button { border: 0; border-radius: 4px; min-height: 34px; background: #3f4249; color: #9ca0aa; font: 600 11px var(--font-body); cursor: pointer; }
  .slots button.open { background: var(--good); color: #fff; }
  .slots button.bk { background: var(--accent-deep); color: #fff; cursor: default; }

  /* Pills */
  .st { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; white-space: nowrap; display: inline-block; }
  .st.ok { background: var(--good-soft); color: #86efac; }
  .st.wait { background: var(--warn-soft); color: #fdba74; }
  .st.no { background: #3f1d1d; color: #fca5a5; }
  .st.info { background: #1e3a8a; color: #bfdbfe; }

  /* Locked view */
  .locked { background: #26282d; border: 1px dashed #5a5d66; border-radius: 12px; padding: 28px; display: grid; gap: 12px; justify-items: start; }
  .locked h2 { font: 800 28px var(--font-display); text-transform: uppercase; }
  .locked p { color: #c9ccd2; max-width: 60ch; }
  .locked ul { margin: 0; padding-left: 18px; color: #c9ccd2; display: grid; gap: 6px; font-size: 14px; }
  .ghost { opacity: .35; pointer-events: none; filter: grayscale(.4); }

  /* Cards */
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .card2 { background: #2c2e33; border-radius: 10px; padding: 14px; display: grid; gap: 6px; align-content: start; min-width: 0; }
  .card2 b { font-size: 14px; }
  .card2 .big { font: 800 30px/1 var(--font-display); }
  .card2 .bar { margin: 4px 0 0; height: 5px; } .card2 .bar i { background: var(--good); }
  .card2.current { outline: 2px solid var(--accent); }

  /* Messages */
  .inbox { display: grid; grid-template-columns: 280px 1fr; gap: 14px; align-items: start; }
  .thread { display: grid; gap: 2px; }
  .thread button { text-align: left; background: #2c2e33; border: 0; border-radius: 8px; padding: 10px 12px; color: var(--fg); font-family: inherit; cursor: pointer; display: grid; gap: 2px; }
  .thread button[aria-pressed="true"] { background: #3a1d0d; outline: 1px solid var(--accent); }
  .thread button b { font-size: 13px; } .thread button span { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bubbles { display: grid; gap: 8px; margin-bottom: 12px; }
  .bub { max-width: 75%; background: #2c2e33; border-radius: 10px; padding: 9px 12px; font-size: 13px; }
  .bub.me { justify-self: end; background: var(--accent-deep); }
  .bub small { display: block; font-size: 10px; color: #c9ccd2; margin-top: 3px; }
  .checks { display: flex; gap: 14px; font-size: 13px; flex-wrap: wrap; }
  .checks input { width: auto; accent-color: var(--blue); }
  .checks label { display: flex; align-items: center; gap: 5px; }
  .checks label.off { color: var(--muted); }

  /* Reports */
  .chart { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; align-items: end; height: 200px; padding: 10px 6px 0; border-bottom: 1px solid #55585f; }
  .chart div { display: grid; gap: 6px; justify-items: center; align-self: end; }
  .chart i { display: block; width: 70%; max-width: 54px; background: var(--accent); border-radius: 4px 4px 0 0; }
  .chart i.cur { background: #fb923c; }
  .chart span { font-size: 11px; color: #c9ccd2; font-variant-numeric: tabular-nums; }
  .chart-x { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; text-align: center; font-size: 12px; color: var(--muted); margin-top: 6px; }

  /* Subscriptions */
  .subgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .subcard { background: #2c2e33; border: 1px solid #45484f; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 12px; position: relative; }
  .subcard.cur { border: 2px solid var(--accent); }
  .subcard .tag { position: absolute; top: -11px; left: 18px; background: var(--accent); color: var(--accent-ink); font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 4px; }
  .subcard h3 { font-size: 26px; } .subcard h3 b { color: var(--accent); }
  .subcard .amt { font: 800 40px/1 var(--font-display); } .subcard .amt small { font: 500 12px var(--font-body); color: var(--muted); }
  .subcard ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; font-size: 13px; }
  .subcard li::before { content: "✓ "; color: var(--good); font-weight: 700; }
  .subcard .btn { margin-top: auto; }

  /* FAQ */
  details.fq { background: #2c2e33; border-radius: 8px; padding: 12px 14px; }
  details.fq summary { cursor: pointer; font-weight: 600; font-size: 14px; display: flex; justify-content: space-between; gap: 10px; }
  details.fq p { color: #c9ccd2; font-size: 13px; margin-top: 8px; }
  .fq-list { display: grid; gap: 8px; }

  @media (max-width: 1100px) { .tasks { grid-template-columns: repeat(3, 1fr); } .grid2, .inbox { grid-template-columns: 1fr; } .cards, .subgrid { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    .side { position: static; height: auto; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
    .side nav { display: flex; overflow-x: auto; gap: 4px; padding-bottom: 4px; }
    .side nav a { white-space: nowrap; } .side nav .grp, .plan, .logout { display: none; }
    .main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .profile-grid { grid-template-columns: 1fr; } .avatar-col { order: -1; }
    .form .row3, .form .row4 { grid-template-columns: 1fr 1fr; }
    .week { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 520px) {
    .tasks, .cards, .subgrid, .form .row2, .form .row3, .form .row4 { grid-template-columns: 1fr; }
    .month .d { min-height: 60px; } .month .ev { font-size: 0; height: 6px; padding: 0; }
    .agenda .ag { grid-template-columns: 1fr; gap: 2px; }
  }
</style>
</head>
<body>
<div class="demo-bar">
  <span>Practice demo · <a href="./">Home page</a> · <a href="book.html">Public booking page</a> · <a href="media.html">Photographer dashboard</a></span>
  <span class="viewas" role="group" aria-label="View the dashboard as a coach on">Viewing as:
    <button type="button" data-plan="basic" aria-pressed="false">365 Basic</button>
    <button type="button" data-plan="pro" aria-pressed="true">365 Pro</button>
    <button type="button" data-plan="elite" aria-pressed="false">365 Elite</button>
  </span>
</div>
<div class="app">
  <aside class="side">
    <a class="brand" href="./"><img src="assets/logo.png" alt=""><span>Sports<b>365</b></span></a>
    <nav aria-label="Dashboard" id="nav"></nav>
    <div class="plan"><b id="plan-name">365 Pro</b><span class="muted" id="plan-renew"></span><button class="linkbtn" type="button" data-go="subscriptions" style="text-align:left;font-weight:600">Manage plan →</button></div>
    <button class="btn btn-sm logout" type="button" data-toast="Demo: you'd be logged out">Logout</button>
  </aside>
  <main class="main" id="main"></main>
</div>

<div class="toast" id="toast" hidden></div>
<script>
/* ---------------- Basics ---------------- */
const $ = s => document.querySelector(s);
const toastEl = $('#toast'); let tm;
function show(msg) { toastEl.textContent = msg; toastEl.hidden = false; clearTimeout(tm); tm = setTimeout(() => { toastEl.hidden = true; }, 2600); }
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function renderNav() {
  const pending = requests.filter(r => r.state === 'new').length;
  $('#nav').innerHTML = NAV.map(([id, label, need]) => {
    if (id === 'grp') return `<span class="grp">${label}</span>`;
    const extra = id === 'requests' && pending ? `<span class="count">${pending}</span>`
      : need && !has(need) ? `<span class="lock">${need.toUpperCase()}</span>` : '';

  }).join('');
}

function head(title, sub, acts = '', tier = '') {
  const t = tier ? ` <span class="tier ${tier}">${tier}</span>` : '';

let calMode = 'month';
V.calendar = () => {
  const acts = '<button class="btn btn-white btn-sm" type="button" data-toast="Demo: connects your Google Calendar">Sync with Google Calendar</button>';
  const seg = `<div class="seg" role="group" aria-label="Calendar view">${[['week', 'Week'], ['month', 'Month'], ['year', 'Year'], ['agenda', 'Sports Agenda']].map(([k, l]) => `<button type="button" data-cal="${k}" aria-pressed="${calMode === k}">${l}</button>`).join('')}</div>`;
  let body = '';
  if (calMode === 'month' || calMode === 'year') {
    let cells = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(d => `<div class="dh">${d}</div>`).join('');
    const days = [26, 27, 28, 29, 30, 31].map(n => ({ n, out: true })).concat(Array.from({ length: 30 }, (_, i) => ({ n: i + 1 }))).concat([1, 2, 3, 4, 5, 6].map(n => ({ n, out: true })));
    cells += days.map(d => `<div class="d${d.out ? ' out' : ''}${!d.out && d.n === 2 ? ' today' : ''}"><span class="n">${String(d.n).padStart(2, '0')}</span>${!d.out && CAL[d.n] ? CAL[d.n].map(([c, t]) => `<span class="ev ${c}">${t}</span>`).join('') : ''}</div>`).join('');
    body = `<div class="panel-head" style="margin:12px 0 0"><h2>November 2026</h2><span class="sub">${calMode === 'year' ? 'Year view shows all 12 months in the real app. This demo shows November.' : 'Tap a day to see details'}</span></div><div class="month">${cells}</div>`;
  } else if (calMode === 'week') {
    const wk = [['Sun', 1], ['Mon', 2], ['Tue', 3], ['Wed', 4], ['Thu', 5], ['Fri', 6], ['Sat', 7]];
    body = `<div class="panel-head" style="margin:12px 0 0"><h2>November 1 – 7</h2></div><div class="week">${wk.map(([d, n]) => `<div class="wc${n === 2 ? ' today' : ''}"><h4>${d} ${n}</h4>${(CAL[n] || []).map(([c, t]) => `<span class="ev ${c}">${t}</span>`).join('') || '<span class="sub" style="text-align:center">Open</span>'}</div>`).join('')}</div>`;
  } else {
    const rows = Object.keys(CAL).map(Number).filter(n => n >= 2 && n <= 14).flatMap(n => CAL[n].map(([c, t]) => {
      const [time, ...rest] = t.split(' ');
      const dow = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][(n - 1) % 7];
      return `<div class="ag"><b class="d">${dow}, Nov ${n}</b><span>${time.replace('p', ':00 PM').replace('a', ':00 AM')}</span><span>${rest.join(' ')} · ${CAL_NAMES[c].split(' · ')[1] || CAL_NAMES[c]}</span><span class="ev ${c}" style="justify-self:end">${CAL_NAMES[c].split(' · ')[0]}</span></div>`;
    }));
    body = `<div class="panel-head" style="margin:12px 0 0"><h2>Next two weeks</h2></div><div class="agenda">${rows.join('')}</div>`;
  }
  return head('Calendar', 'Practices, games, sessions and events in one place.', acts) + `<section class="panel">${seg}${body}<div class="legend"><span><i style="background:var(--accent-deep)"></i>Team practice</span><span><i style="background:var(--blue)"></i>Private session</span><span><i style="background:var(--violet)"></i>Group / event</span><span><i style="background:var(--good)"></i>Game</span></div></section>`;
};

let showFaqForm = false;
V.faqs = () => head('FAQs', 'Answers families see on your public booking page.', '<button class="btn btn-good btn-sm" type="button" id="faq-new">+ Add FAQ</button>') +
  (showFaqForm ? `<section class="panel"><form class="form" id="faq-form"><label class="field">Question<input id="faq-q" required placeholder="e.g. Where are sessions held?"></label><label class="field">Answer<textarea id="faq-a" rows="2" required></textarea></label><div class="btns"><button class="btn btn-good" type="submit">Save FAQ</button><button class="btn btn-ghost" type="button" id="faq-cancel">Cancel</button></div></form></section>` : '') +
  `<section class="panel"><div class="fq-list">${faqs.map((f, i) => `<details class="fq"${i === 0 ? ' open' : ''}><summary>${esc(f[0])}<span class="sub">Shown on your page</span></summary><p>${esc(f[1])}</p></details>`).join('')}</div></section>`;

/* ---------------- Render + events ---------------- */
function render() {
  const p = P();
  document.querySelectorAll('.viewas button').forEach(b => b.setAttribute('aria-pressed', b.dataset.plan === plan ? 'true' : 'false'));
  $('#plan-name').textContent = p.name;
  $('#plan-renew').textContent = `Yearly · ${p.price.y} · renews Oct 15, 2027`;
  renderNav();
  $('#main').innerHTML = `<div class="view">${V[view]()}</div>`;
}
function go(v) { if (!V[v]) return; view = v; render(); window.scrollTo(0, 0); try { history.replaceState(null, '', '#' + v); } catch (e) {} }
function setPlan(k, quiet) { plan = k; try { localStorage.setItem('s365-plan', k); } catch (e) {} render(); if (!quiet) show(`Now viewing as a ${PLANS[k].name} coach`); }

document.addEventListener('click', async e => {
  const t = e.target.closest('button, a'); if (!t) return;
  const d = t.dataset;
  if (d.go) { e.preventDefault(); go(d.go); return; }
  if (d.plan) { setPlan(d.plan); return; }
  if (d.toast) { show(d.toast); return; }
  if (d.copy !== undefined) { try { await navigator.clipboard.writeText('https://sports365app.com/coach/jordan-reed'); show('Booking link copied'); } catch (err) { show('Link: sports365app.com/coach/jordan-reed'); } return; }
  if (d.cal) { calMode = d.cal; render(); return; }
  if (d.req) { const r = requests[+d.req]; r.state = d.act; render(); show(d.act === 'ok' ? 'Accepted. Added to Booked Sessions.' : 'Declined. The family was notified.'); return; }
  if (d.slot) { const s = avail[d.slot]; if (s === 'bk') { show('This time is booked. Cancel the session to close it.'); return; } avail[d.slot] = s === 'open' ? '' : 'open'; render(); return; }
  if (d.ttab) { teamTab = d.ttab; render(); return; }
  if (d.roster) { teamSel = d.roster; teamTab = 'roster'; render(); return; }
  if (d.thread) { thread = +d.thread; render(); return; }
  if (d.bill) { billing = d.bill; render(); return; }
  if (d.switch) { setPlan(d.switch, true); show(`Demo: switched to ${PLANS[d.switch].name}`); return; }
  if (t.id === 'ev-new') { showEventForm = true; render(); return; }
  if (t.id === 'ev-cancel') { showEventForm = false; render(); return; }
  if (t.id === 'faq-new') { showFaqForm = true; render(); return; }
  if (t.id === 'faq-cancel') { showFaqForm = false; render(); return; }
  if (t.id === 'add-team') {
    if (teams.length >= P().teams) return;
    const names = ['Eastside Elite 13U', 'Summer Shooting Crew', 'Girls Skills Group', 'Varsity Prep', 'Bigs Footwork', 'Saturday Clinic Group', 'Middle School Guards', 'Fall League Team'];
    const id = 't' + (teams.length + 1);
    teams.push({ id, name: names[(teams.length - 2) % names.length], sport: 'Basketball', desc: 'New team' }); rosterCount[id] = 0; roster[id] = [];
    render(); show('Demo: team added. Invite up to 55 players.'); return;
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'profile-form') show('Demo: profile updated');
  if (f.id === 'ev-form') {
    const v = id => document.getElementById(id).value.trim();
    events.unshift({ name: v('ev-name'), date: v('ev-date'), time: v('ev-time'), place: v('ev-place'), price: v('ev-price'), spots: `0 / ${v('ev-spots') || '—'}`, pay: v('ev-pay'), ages: v('ev-ages') || 'All' });
    showEventForm = false; render(); show('Demo: event created');
  }
  if (f.id === 'faq-form') { faqs.push([document.getElementById('faq-q').value.trim(), document.getElementById('faq-a').value.trim()]); showFaqForm = false; render(); show('Demo: FAQ added to your page'); }
  if (f.id === 'msg-form') {
    const txt = document.getElementById('msg-text').value.trim();
    if (!txt) { show('Write a message first'); return; }
    THREADS[thread].msgs.push(['me', esc(txt), 'Just now']); THREADS[thread].last = txt; render(); show('Demo: message sent');
  }
});
document.addEventListener('input', e => { if (e.target.id === 'ev-q') { eventQuery = e.target.value; const pos = e.target.selectionStart; render(); const q = document.getElementById('ev-q'); q.focus(); q.setSelectionRange(pos, pos); } });
document.addEventListener('change', e => { if (e.target.id === 'team-sel') { teamSel = e.target.value; render(); } });

const h0 = location.hash.slice(1);
if (VIEWS.includes(h0)) view = h0;
render();
</script>
</body>
</html>
